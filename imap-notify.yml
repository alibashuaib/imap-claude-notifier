name: IMAP Claude Notifier

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (UTC). GitHub may delay this slightly under load.
  workflow_dispatch: {}      # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write   # needed so the workflow can save state.json back to the repo

jobs:
  check-mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python imap_claude_notifier.py

      - name: Save state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git push
